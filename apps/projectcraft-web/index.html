<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#18202b">
  <title>ProjectCraft</title>
  <link data-trunk rel="rust">
  <style>
    html,body { height:100%;width:100%;margin:0;overflow:hidden;background:#18202b;color:#f1f5f9;font-family:system-ui,sans-serif }
    canvas { display:block;width:100%;height:100%;outline:none }
    #boot-status { position:fixed;inset:auto 1rem 2rem 1rem;z-index:10;max-width:680px;margin:auto;padding:1rem 1.25rem;background:#243041;color:#f1f5f9;border:1px solid #536276;border-radius:10px;box-shadow:0 6px 24px #0008;white-space:pre-wrap;overflow-wrap:anywhere }
    [hidden] { display:none !important }
  </style>
</head>
<body>
  <canvas id="projectcraft_canvas" aria-label="ProjectCraft application"></canvas>
  <div id="boot-status" role="status" aria-live="polite">Loading ProjectCraft's web interface…</div>
  <noscript>ProjectCraft requires WebAssembly and JavaScript to display its original Rust interface.</noscript>
</body>
</html>
